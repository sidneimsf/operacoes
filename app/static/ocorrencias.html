<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocorrências · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">

      <div class="chips" id="chips-status"></div>

      <div class="filter-row">
        <div class="field">
          <label for="filtro-empresa">Empresa</label>
          <select id="filtro-empresa"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="filtro-cliente">Cliente</label>
          <select id="filtro-cliente"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="filtro-tipo">Tipo</label>
          <select id="filtro-tipo"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="filtro-prioridade">Prioridade</label>
          <select id="filtro-prioridade"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="filtro-responsavel">Responsável</label>
          <select id="filtro-responsavel"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="filtro-data-inicio">De</label>
          <input type="date" id="filtro-data-inicio">
        </div>
        <div class="field">
          <label for="filtro-data-fim">Até</label>
          <input type="date" id="filtro-data-fim">
        </div>
      </div>

      <div id="lista-chamados">
        <div class="loading-state">Carregando chamados...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/ocorrencias.js"></script>
</body>
</html>

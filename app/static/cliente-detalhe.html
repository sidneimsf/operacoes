<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title">Cliente</h1>
    </div>
    <div class="content">

      <a href="/clientes" class="back-link">← Voltar para Clientes</a>

      <div class="cliente-header" id="cliente-header">
        <div class="loading-state">Carregando...</div>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 24px;">
        <button class="btn-ghost" id="btn-editar-cliente">Editar</button>
        <button class="btn-ghost" id="btn-toggle-cliente"></button>
      </div>

      <div class="kpi-grid" id="kpi-resumo"></div>

      <div class="section-title">Quem atende este cliente</div>
      <div id="mapa-servicos">
        <div class="loading-state">Carregando...</div>
      </div>

      <div class="section-title" style="margin-top: 30px;">Histórico de atendimentos</div>
      <div id="timeline">
        <div class="loading-state">Carregando histórico...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/cliente-detalhe.js"></script>
</body>
</html>

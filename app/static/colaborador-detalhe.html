<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaborador · operações</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title">Colaborador</h1>
    </div>
    <div class="content">

      <a href="/colaboradores" class="back-link">← Voltar para Colaboradores</a>

      <div class="cliente-header" id="colaborador-header">
        <div class="loading-state">Carregando...</div>
      </div>

      <div style="margin-bottom: 24px;">
        <button class="btn-ghost" id="btn-editar-colaborador">Editar dados</button>
      </div>

      <div class="section-title">Mapa de serviços da semana</div>
      <div id="mapa-servicos">
        <div class="loading-state">Carregando...</div>
      </div>

      <div class="avisos-header" style="margin-top: 30px;">
        <span class="section-title" style="margin: 0;">Linha do tempo</span>
        <button class="btn-primary" id="btn-novo-registro">+ Novo registro</button>
      </div>

      <div id="timeline">
        <div class="loading-state">Carregando histórico...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/colaborador-detalhe.js"></script>
</body>
</html>

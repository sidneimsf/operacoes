<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisão · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#17354f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Operações">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">

      <div class="tabs-relatorio" style="margin-bottom: 20px;">
        <button class="tab-relatorio ativa" data-aba="visitas">Visitas registradas</button>
        <button class="tab-relatorio" data-aba="ultima-visita">Última visita por cliente</button>
      </div>

      <div id="aba-visitas">
        <div class="avisos-header">
          <span class="section-title" style="margin: 0;">Visitas registradas</span>
          <button class="btn-primary" id="btn-nova-visita">+ Registrar visita</button>
        </div>
        <div class="field" style="max-width: 320px; margin-bottom: 16px;">
          <label for="visitas-busca-cliente">Buscar por cliente</label>
          <div class="busca-select">
            <input type="text" id="visitas-busca-cliente" placeholder="Digite o nome do cliente..." autocomplete="off">
            <div class="busca-select-resultados" id="visitas-busca-cliente-resultados" hidden></div>
          </div>
        </div>
        <div id="lista-visitas">
          <div class="loading-state">Carregando visitas...</div>
        </div>
      </div>

      <div id="aba-ultima-visita" hidden>
        <div id="relatorio-ultima-visita">
          <div class="loading-state">Carregando relatório...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/supervisao.js"></script>
</body>
</html>

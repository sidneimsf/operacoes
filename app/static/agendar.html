<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#17354f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Operações">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">

      <div class="avisos-header">
        <div class="calendario-navegacao">
          <button class="btn-ghost" id="btn-mes-anterior">‹</button>
          <span class="calendario-titulo-mes" id="calendario-titulo-mes"></span>
          <button class="btn-ghost" id="btn-mes-seguinte">›</button>
          <button class="btn-ghost" id="btn-mes-hoje">Hoje</button>
        </div>
        <button class="btn-primary" id="btn-nova-tarefa">+ Nova tarefa</button>
      </div>

      <div class="calendario-grade" id="calendario-grade">
        <div class="loading-state">Carregando...</div>
      </div>

      <div class="section-title" style="margin-top: 30px;">Pendentes (hoje e atrasadas)</div>
      <div id="lista-pendentes">
        <div class="loading-state">Carregando...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/agendar.js"></script>
</body>
</html>

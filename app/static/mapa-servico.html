<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Serviço · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">

      <div class="section-title">Histórico de vínculos colaborador × cliente</div>
      <div class="meta" style="margin-bottom: 20px;">Quem começou, quem saiu, e quanto tempo cada colaborador ficou em cada cliente.</div>

      <div class="filter-row" style="align-items: flex-end;">
        <div class="field">
          <label for="filtro-colaborador">Colaborador</label>
          <select id="filtro-colaborador"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="filtro-cliente">Cliente</label>
          <select id="filtro-cliente"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="filtro-status">Situação</label>
          <select id="filtro-status">
            <option value="todos">Todos</option>
            <option value="ativos" selected>Ativos agora</option>
            <option value="encerrados">Encerrados</option>
          </select>
        </div>
      </div>

      <div class="kpi-grid" id="kpi-grid-historico" style="margin-top: 4px;">
        <div class="kpi-card"><div class="label">vínculos ativos</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">encerrados</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">tempo médio (dias)</div><div class="value">—</div></div>
      </div>

      <div id="lista-historico" style="margin-top: 10px;">
        <div class="loading-state">Carregando...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/mapa-servico.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#17354f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Operações">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">
      <div class="avisos-header">
        <div class="chips" id="chips-empresas" style="margin: 0;"></div>
        <button class="btn-primary" id="btn-novo-cliente">+ Novo cliente</button>
      </div>
      <div class="filter-row">
        <div class="field">
          <label for="busca-cliente">Buscar</label>
          <input type="text" id="busca-cliente" placeholder="Buscar por nome...">
        </div>
        <div class="field">
          <label for="filtro-bairro">Bairro</label>
          <select id="filtro-bairro"><option value="">Todos os bairros</option></select>
        </div>
        <div class="field" style="align-self: end;">
          <a class="btn-ghost" id="link-mapa-clientes" href="/mapa-clientes" style="display: inline-block; text-decoration: none;">Ver no mapa</a>
        </div>
      </div>
      <div id="lista-clientes">
        <div class="loading-state">Carregando clientes...</div>
      </div>
    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/clientes.js"></script>
</body>
</html>

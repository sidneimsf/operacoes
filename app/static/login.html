<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · operações</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-screen">
  <div class="login-brand">
    <div>
      <span class="wordmark">SolarSync</span>
      <h1>operações</h1>
      <p>Zeladoria, limpeza e manutenção. Um só lugar para supervisores e escritório acompanharem clientes, folha de ponto e documentação.</p>
    </div>

    <div class="status-readout">
      <div class="row"><span><span class="status-dot"></span>sistema</span><span>operacional</span></div>
      <div class="row"><span>empresas</span><span id="stat-empresas">—</span></div>
      <div class="row"><span>clientes ativos</span><span id="stat-clientes">—</span></div>
    </div>
  </div>

  <div class="login-form-panel">
    <form class="login-form" id="login-form" novalidate>
      <h2>Entrar</h2>
      <p class="subtitle">Use o e-mail e senha cadastrados pela equipe.</p>

      <div class="error-message" id="error-message"></div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-primary" id="btn-entrar">Entrar</button>
    </form>
  </div>
</div>

<script src="/static/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASOs · operações</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">

      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card"><div class="label">vencidos</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">vencendo em 7 dias</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">em dia</div><div class="value">—</div></div>
      </div>

      <div class="avisos-header">
        <span class="section-title" style="margin: 0;">Controle de ASOs</span>
        <div style="display: flex; gap: 10px;">
          <button class="btn-primary" id="btn-novo-aso">+ Adicionar ASO</button>
          <button class="btn-ghost" id="btn-testar-email">Testar envio de e-mail</button>
        </div>
      </div>

      <div id="resultado-teste-email"></div>

      <div class="field" style="max-width: 320px; margin-bottom: 16px;">
        <input type="text" id="busca-aso" placeholder="Buscar colaborador...">
      </div>

      <div id="lista-asos">
        <div class="loading-state">Carregando...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/asos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaboradores · operações</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <div class="main-area">
    <div class="topbar" id="topbar">
      <h1 id="topbar-title"></h1>
    </div>
    <div class="content">

      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card"><div class="label">total</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">ativos</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">afastados</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">admitidos este mês</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">em atestado</div><div class="value">—</div></div>
        <div class="kpi-card"><div class="label">faltantes hoje</div><div class="value">—</div></div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 8px;">
        <div>
          <div class="section-title">Por empresa</div>
          <div id="breakdown-empresa"><div class="loading-state">Carregando...</div></div>
        </div>
        <div>
          <div class="section-title">Por supervisor</div>
          <div id="breakdown-supervisor"><div class="loading-state">Carregando...</div></div>
        </div>
      </div>

      <div class="avisos-header" style="margin-top: 30px;">
        <span class="section-title" style="margin: 0;">Lista de colaboradores</span>
        <button class="btn-primary" id="btn-novo-colaborador">+ Novo colaborador</button>
      </div>

      <div class="filter-row">
        <div class="field">
          <label for="filtro-empresa">Empresa</label>
          <select id="filtro-empresa"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="filtro-supervisor">Supervisor</label>
          <select id="filtro-supervisor"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="filtro-status">Status</label>
          <select id="filtro-status">
            <option value="">Todos (exceto desligados)</option>
            <option value="ativo">Ativo</option>
            <option value="afastado">Afastado</option>
            <option value="desligado">Desligado</option>
          </select>
        </div>
        <div class="field">
          <label for="filtro-busca">Buscar nome</label>
          <input type="text" id="filtro-busca" placeholder="Digite um nome...">
        </div>
      </div>

      <div id="lista-colaboradores">
        <div class="loading-state">Carregando colaboradores...</div>
      </div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/colaboradores.js"></script>
</body>
</html>
